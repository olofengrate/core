rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not provide actions.
  appropriate-polling: done
  brands:
    status: exempt
    comment: Brand assets will be submitted to home-assistant/brands repository.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not provide actions.
  docs-high-level-description:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-installation-instructions:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-removal-instructions:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not provide actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-installation-parameters:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud API integration, no local network discovery.
  discovery:
    status: exempt
    comment: Cloud API integration, no device discovery.
  docs-data-update:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-examples:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-known-limitations:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-supported-devices:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-supported-functions:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-troubleshooting:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  docs-use-cases:
    status: exempt
    comment: Documentation will be submitted to home-assistant/home-assistant.io repository.
  dynamic-devices:
    status: exempt
    comment: One device per config entry, no dynamic device addition.
  entity-category:
    status: exempt
    comment: Single primary entity, no diagnostic or config entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Single entity that should always be enabled.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No user-recoverable issues that require repair flows.
  stale-devices:
    status: exempt
    comment: One device per config entry, removed when entry is removed.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
